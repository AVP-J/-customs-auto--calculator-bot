name: Deploy Customs Bot
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Setting up SSH for $SERVER_USER@$SERVER_IP"
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Добавляем ВСЕ необходимые хосты
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "✅ SSH настроен"
      
      - name: 🚀 Deploy to Server
        if: env.SERVER_IP != ''
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "🚀 Deploying Customs Bot to server..."
          
          # Определяем ветку
          if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            BRANCH="develop"
            ENV_FILE=".env.development"
            echo "📱 Deploying from DEVELOP branch (testing)"
          else
            BRANCH="main"
            ENV_FILE=".env.production"
            echo "🚀 Deploying from MAIN branch (production)"
          fi
          
          ssh $SERVER_USER@$SERVER_IP "
            echo '1. Переходим в директорию бота...'
            cd /opt/customs-bot
            
            echo '2. Настраиваем Git для SSH...'
            git config --global --add safe.directory /opt/customs-bot
            
            echo '3. Получаем обновления из ветки $BRANCH...'
            git fetch origin
            
            echo '4. Сбрасываем на последнюю версию ветки $BRANCH...'
            git reset --hard origin/$BRANCH
            
            echo '5. Используем конфиг для $BRANCH...'
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" .env
              echo '   ✅ Конфиг применён: $ENV_FILE -> .env'
            else
              echo '   ⚠️  Конфиг $ENV_FILE не найден, используем .env по умолчанию'
            fi
            
            echo '6. Запускаем деплой...'
            ./deploy.sh
            
            echo '7. Проверяем результат...'
            git log --oneline -n 3 && echo '✅ Код обновлён'
            
            echo '8. Статус бота...'
            sudo systemctl status customs-bot --no-pager || echo '⚠️  Сервис не запущен'
          "
          
          echo "✅ Deployment complete from $BRANCH branch!"
          
          # Отправляем уведомление в Telegram
          if [[ "$BRANCH" == "develop" ]]; then
            echo "📱 Тестовый деплой завершён. Проверяй бота!"
          else
            echo "🚀 Продакшен деплой завершён."
          fi

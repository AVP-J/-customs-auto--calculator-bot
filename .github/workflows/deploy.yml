name: Deploy Bot

on:
  workflow_run:
    workflows: ["Test Bot"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.10'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Prepare deployment package
      run: |
        echo "📦 Подготовка пакета для деплоя..."
        
        # Создаём архив с кодом
        tar -czf customs-bot-$(date +%Y%m%d-%H%M%S).tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='venv' \
          --exclude='.env' \
          .
        
        echo "✅ Пакет создан"
        ls -la *.tar.gz
    
    - name: 📋 Create deployment report
      run: |
        echo "🚀 ОТЧЁТ О ГОТОВНОСТИ К ДЕПЛОЮ" > deploy-report.md
        echo "==============================" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "📅 Дата: $(date)" >> deploy-report.md
        echo "🔖 Коммит: ${{ github.sha }}" >> deploy-report.md
        echo "🌿 Ветка: ${{ github.ref }}" >> deploy-report.md
        echo "" >> deploy-profile.md
        echo "📁 Файлы в пакете:" >> deploy-report.md
        echo "\`\`\`" >> deploy-report.md
        find . -type f -name "*.py" | head -20 >> deploy-report.md
        echo "\`\`\`" >> deploy-report.md
        echo "" >> deploy-report.md
        echo "📦 Зависимости:" >> deploy-report.md
        echo "\`\`\`" >> deploy-report.md
        cat requirements.txt >> deploy-report.md
        echo "\`\`\`" >> deploy-report.md
        
        cat deploy-report.md
    
    - name: 📢 Notify deployment ready
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "📢 Уведомление о готовности к деплою"
        echo "Бот успешно протестирован и готов к развёртыванию"
        echo ""
        echo "Для деплоя выполните:"
        echo "1. Подключитесь к VPS серверу"
        echo "2. Выполните: ./deploy.sh"
        echo ""
        echo "Или настройте автоматический деплой добавив:"
        echo "- SSH ключ в Secrets (DEPLOY_SSH_KEY)"
        echo "- Адрес сервера в Secrets (DEPLOY_HOST)"
        
        # Если есть токен бота, отправляем уведомление в Telegram
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          echo "Отправляю уведомление в Telegram..."
          MESSAGE="✅ *Customs Bot готов к деплою!*
          
📅 $(date)
🔖 Коммит: ${{ github.sha }}
🌿 Ветка: ${{ github.ref }}

🧪 Тесты пройдены успешно
📦 Пакет собран

🚀 Для деплоя выполни:
\`ssh user@server './deploy.sh'\`

Или настрой автоматический деплой в GitHub Actions."
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown" \
            > /dev/null 2>&1 || echo "Не удалось отправить в Telegram"
        fi
    
    - name: 🎯 Manual deployment trigger
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'manual-deploy.yml',
            ref: 'main'
          })
      if: github.ref == 'refs/heads/main'
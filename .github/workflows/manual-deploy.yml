name: Manual Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      version:
        description: 'Version to deploy (git tag or commit)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || 'main' }}
    
    - name: 🔐 Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        SSH_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Добавляем хост в known_hosts
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        echo "SSH настроен для $SSH_USER@$SSH_HOST"
    
    - name: 🚀 Deploy to VPS
      env:
        SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        SSH_USER: ${{ secrets.DEPLOY_USER }}
        ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        echo "🚀 Деплой на $ENVIRONMENT окружение..."
        
        if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
          echo "❌ SSH хост или пользователь не настроены"
          echo ""
          echo "Для настройки автоматического деплоя:"
          echo "1. Создайте SSH ключ на сервере: ssh-keygen -t rsa"
          echo "2. Добавьте публичный ключ в ~/.ssh/authorized_keys на сервере"
          echo "3. Добавьте приватный ключ в GitHub Secrets как DEPLOY_SSH_KEY"
          echo "4. Добавьте хост в GitHub Secrets как DEPLOY_HOST"
          echo "5. Добавьте пользователя в GitHub Secrets как DEPLOY_USER"
          echo ""
          echo "Пока деплой можно выполнить вручную:"
          echo "ssh $SSH_USER@$SSH_HOST 'cd /opt/customs-bot && git pull && ./deploy.sh'"
          exit 0
        fi
        
        # Копируем файлы на сервер
        echo "📤 Копируем файлы на сервер..."
        scp -r . $SSH_USER@$SSH_HOST:/tmp/customs-bot-latest/
        
        # Выполняем деплой скрипт на сервере
        echo "🔧 Запускаем деплой на сервере..."
        ssh $SSH_USER@$SSH_HOST "
          cd /tmp/customs-bot-latest
          chmod +x deploy.sh
          ./deploy.sh
        "
        
        echo "✅ Деплой завершён!"
    
    - name: 📢 Send deployment notification
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          ENV=${{ github.event.inputs.environment }}
          VERSION=${{ github.event.inputs.version || 'latest' }}
          
          MESSAGE="🚀 *Деплой Customs Bot завершён!*
          
🌍 Окружение: $ENV
🔖 Версия: $VERSION
📅 $(date)
👤 Инициатор: ${{ github.actor }}

✅ Бот развёрнут на сервере
🔧 Перезапущена systemd служба

📊 Проверь статус:
\`sudo systemctl status customs-bot\`"
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown" \
            > /dev/null 2>&1 || echo "Не удалось отправить в Telegram"
        fi
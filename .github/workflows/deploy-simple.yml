name: Deploy with Variables
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ vars.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔐 Setup SSH
        run: |
          echo "Setting up SSH for $SSH_USER@$SSH_HOST"
          
          # Проверяем переменные
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: SSH_HOST is empty!"
            exit 1
          fi
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Исправленная команда ssh-keyscan
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "✅ SSH настроен"
      
      - name: 🚀 Test Connection
        run: |
          echo "Testing SSH connection..."
          ssh $SSH_USER@$SSH_HOST "echo 'SSH test successful'"


name: Final Debug
on: [workflow_dispatch]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test Variable Access Methods
        run: |
          echo "=== Method 1: Direct ==="
          echo "DEPLOY_HOST: '${{ vars.DEPLOY_HOST }}'"
          echo "DEPLOY_USER: '${{ vars.DEPLOY_USER }}'"
          
          echo "=== Method 2: Through env ==="
          echo "DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}"
          echo "DEPLOY_USER: ${{ vars.DEPLOY_USER }}"
          
          echo "=== Method 3: Using secrets as fallback ==="
          echo "DEPLOY_HOST (secret): '${{ secrets.DEPLOY_HOST }}'"
          echo "DEPLOY_USER (secret): '${{ secrets.DEPLOY_USER }}'"
          
      - name: Test SSH command
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          echo "HOST from env: '$HOST'"
          echo "USER from env: '$USER'"
          
          if [ -n "$HOST" ] && [ -n "$USER" ]; then
            echo "✅ Variables are NOT empty"
            echo "Testing ssh-keyscan..."
            ssh-keyscan "$HOST" 2>/dev/null | head -1 || echo "ssh-keyscan failed"
          else
            echo "❌ Variables ARE empty"
            echo "Check variable names exactly:"
            echo "Expected: DEPLOY_HOST, DEPLOY_USER"
          fi
